<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2A241A" />
      <stop offset="60%" stop-color="#141417" />
      <stop offset="100%" stop-color="#0A0A0B" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FADAA2" />
      <stop offset="45%" stop-color="#E5A93C" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bgGlow)" />
  <rect width="510" height="510" x="1" y="1" rx="103" fill="none" stroke="rgba(229,169,60,0.25)" stroke-width="2" />

  <!-- Burger Icon Illustration -->
  <g transform="translate(106, 120)" filter="url(#glow)">
    <!-- Top Bun -->
    <path d="M 30 110 C 30 30, 270 30, 270 110 Z" fill="url(#goldGrad)" />
    <!-- Seeds -->
    <ellipse cx="110" cy="65" rx="5" ry="3" fill="#FFF7ED" opacity="0.8" />
    <ellipse cx="150" cy="50" rx="5" ry="3" fill="#FFF7ED" opacity="0.8" />
    <ellipse cx="190" cy="68" rx="5" ry="3" fill="#FFF7ED" opacity="0.8" />
    <!-- Cheese layer dripping -->
    <path d="M 20 125 L 280 125 L 230 165 L 190 135 L 140 170 L 90 135 L 50 160 Z" fill="#FBBF24" />
    <!-- Patty -->
    <rect x="25" y="145" width="250" height="35" rx="12" fill="#78350F" />
    <!-- Bottom Bun -->
    <path d="M 35 190 L 265 190 C 265 225, 35 225, 35 190 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Typography: INÊS BURGUER -->
  <text x="256" y="415" font-family="'Syne', sans-serif" font-size="34" font-weight="800" letter-spacing="6" fill="#EDEDEA" text-anchor="middle">
    INÊS BURGUER
  </text>
  <text x="256" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#E5A93C" text-anchor="middle">
    ATIBAIA — SP
  </text>
</svg>
